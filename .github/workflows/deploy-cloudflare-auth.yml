name: Deploy English Vocabulary Auth API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-auth/**"
      - ".github/workflows/deploy-cloudflare-auth.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-auth
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare GitHub secrets are not configured for this repository."
            exit 2
          fi

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Find or create English Vocabulary D1
        run: |
          DB_ID="$(npx wrangler d1 list --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const rows=JSON.parse(s);
              const db=rows.find(x=>x.name==='english-vocabulary-db');
              if(db) process.stdout.write(db.uuid || db.id || '');
            });
          ")"

          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create english-vocabulary-db --location apac
            DB_ID="$(npx wrangler d1 list --json | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                const rows=JSON.parse(s);
                const db=rows.find(x=>x.name==='english-vocabulary-db');
                if(db) process.stdout.write(db.uuid || db.id || '');
              });
            ")"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not resolve english-vocabulary-db ID."
            exit 3
          fi

          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Build runtime Wrangler config
        run: |
          node -e "
            const fs=require('fs');
            const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
            cfg.d1_databases[0].database_id=process.env.DB_ID;
            fs.writeFileSync('wrangler.runtime.jsonc', JSON.stringify(cfg,null,2));
          "

      - name: Apply D1 schema
        run: npx wrangler d1 execute english-vocabulary-db --remote --file=./schema.sql --config wrangler.runtime.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.runtime.jsonc

      - name: Enable workers.dev route
        run: |
          curl --fail-with-body --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/english-vocabulary-api/subdomain"             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"enabled":true,"previews_enabled":false}' > /tmp/worker-subdomain.json

      - name: Print Auth API URL
        run: |
          SUBDOMAIN="$(curl --fail-with-body --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                const payload=JSON.parse(s);
                process.stdout.write(payload.result?.subdomain || '');
              });
            ")"

          if [ -z "$SUBDOMAIN" ]; then
            echo "Could not resolve workers.dev account subdomain."
            exit 4
          fi

          echo "AUTH_API_URL=https://english-vocabulary-api.$SUBDOMAIN.workers.dev"
