name: Apply English Vocabulary v0.4.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".v040/**"
      - ".github/workflows/apply-v040.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild v0.4.0 files
        shell: bash
        run: |
          set -euo pipefail
          cat .v040/app.* | base64 -d | gzip -dc > js/app.js
          cat .v040/lib.* | base64 -d | gzip -dc > js/library.js
          cat .v040/styles.* | base64 -d | gzip -dc > styles.css
          cat .v040/sw.* | base64 -d | gzip -dc > sw.js

      - name: Remove paused authentication backend
        shell: bash
        run: |
          rm -f js/auth.js js/config.js
          rm -rf cloudflare-auth
          rm -f .github/workflows/deploy-cloudflare-auth.yml
          rm -rf .v040

      - name: Validate app
        shell: bash
        run: |
          node --check js/app.js
          node --check js/library.js
          node --check js/db.js
          node --check sw.js
          grep -q "const APP_VERSION = '0.4.0'" js/app.js
          grep -q "english-vocabulary-cache-v0.4.0" sw.js
          grep -q "const DB_VERSION = 2" js/db.js
          grep -q "export const LIBRARY_WORDS" js/library.js

      - name: Commit v0.4.0
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build adaptive learning engine and expand vocabulary library to v0.4.0"
          git push origin HEAD:main
