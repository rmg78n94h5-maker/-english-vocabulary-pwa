<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="English Vocabulary — современный офлайн-тренажёр английских слов и фраз.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="English Vocabulary">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>English Vocabulary</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <header class="app-header">
      <button class="brand-button" type="button" data-action="go-today" aria-label="На главный экран">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span class="brand-copy">
          <strong>English Vocabulary</strong>
          <small>Слова, которые остаются с вами</small>
        </span>
      </button>
      <button id="levelButton" class="level-badge" type="button" data-action="open-level" aria-label="Открыть прогресс уровня">
        <span class="level-ring"><span id="levelNumber">1</span></span>
        <span class="level-copy"><small id="rankName">Новичок</small><strong id="levelXp">0 / 100 XP</strong></span>
      </button>
    </header>

    <div id="connectionBar" class="connection-bar" hidden>Офлайн-режим: изменения сохраняются на устройстве</div>
    <main id="view" class="app-view"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" data-route="today" class="nav-item is-active"><span>⌂</span><small>Сегодня</small></button>
      <button type="button" data-route="dictionary" class="nav-item"><span>▤</span><small>Словарь</small></button>
      <button type="button" data-route="library" class="nav-item"><span>◫</span><small>Библиотека</small></button>
      <button type="button" data-route="study" class="nav-item nav-main"><span>▶</span><small>Занятие</small></button>
      <button type="button" data-route="progress" class="nav-item"><span>▥</span><small>Прогресс</small></button>
      <button type="button" data-route="profile" class="nav-item"><span>●</span><small>Профиль</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
